name: vectorizers
on:
  workflow_dispatch:
  push:
    branches:
    - main
    - master
    tags:
    - release-*
  pull_request:
    branches:
    - master
    - main
    paths-ignore:
    - doc/**
    - README.rst
env:
  triggeredByPullRequest: "$[eq(variables['Build.Reason'], 'PullRequest')]"
jobs:
  RunAllTests-run_platform_tests:
    runs-on:
      - "${{ matrix.image-name }}"
    strategy:
      # Don't stop other jobs if one fails
      fail-fast: false
      matrix:
        image-name: [ubuntu-latest, windows-latest, macos-latest, ubuntu-26.04-arm]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install uv and set python version to "${{ matrix.python-version }}"
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: "${{ matrix.python-version }}"
    # - name: Upgrade pip
    #   run: python -m pip install --upgrade pip
    - name: Print python version
      run: uv run python -c "import sys; print(sys.version)"
